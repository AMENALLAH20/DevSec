
services:
  mysqldb:
    image: mysql:5.7
    container_name: mysqldb
    restart: always
    environment:
      MYSQL_DATABASE: ihm
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - mynetwork

  explore-api:
    container_name: explore-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8094:8094"
    depends_on:
      - mysqldb
    environment:
        DB_URL: jdbc:mysql://mysqldb:3306/ihm
        MYSQL_USER: user
        MYSQL_PASSWORD: password
        MYSQL_PORT: "3306"
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge

volumes:
  mysql-data:
