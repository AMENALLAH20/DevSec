# Nom de l'application
spring.application.name=Loisir

# Configuration du port du serveur
server.port=8094

### CONFIGURATION DE LA BASE DE DONNÉES ###
# URL de connexion à la base de données MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ihm?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC&useSSL=false

# Identifiants de connexion à la base de données
spring.datasource.username=root
spring.datasource.password=

# Driver JDBC MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

### CONFIGURATION JPA / HIBERNATE ###
# Afficher les requêtes SQL générées dans la console (utile en développement)
spring.jpa.show-sql=true

# Création et mise à jour automatique des tables selon les entités
spring.jpa.hibernate.ddl-auto=update

# Définir le dialecte SQL pour MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

### CONFIGURATION JWT ###
# Clé secrète pour signer les tokens JWT
levelOne.app.jwtSecret=bezKoderSecretKey

# Durée de validité des tokens JWT (en millisecondes) - ici 1 jour
levelOne.app.jwtExpirationMs=86400000
